name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Guardrail tests (always run, no API key needed)
        run: pytest tests/test_guardrails.py -v

      - name: Agent + DeepEval regression tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest tests/test_agent_integration.py tests/test_deepeval_regression.py -v -s
        # These skip automatically (not fail) if ANTHROPIC_API_KEY isn't set as a repo secret.
        # Add one via: gh secret set ANTHROPIC_API_KEY --repo <owner>/<repo>
